<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WordGarden · 词汇花园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Grotesk:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF1E8;
    --paper-2: #E6EADE;
    --ink: #263229;
    --ink-soft: #5C6B5F;
    --line: #cdd4c4;

    --psych: #8B7FC7;
    --psych-bg: #EDEAF8;
    --econ: #BD9A2E;
    --econ-bg: #F7F0DA;
    --hist: #B0603A;
    --hist-bg: #F6E4D9;
    --socio: #3E8C82;
    --socio-bg: #DFEEEB;

    --work: #5B7DB1;
    --work-bg: #E4EAF3;
    --social: #C76B8B;
    --social-bg: #F5E3EA;
    --lifestyle: #7C9070;
    --lifestyle-bg: #E7EDE1;
    --emotion: #D98B3F;
    --emotion-bg: #F7E7D3;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(38,50,41,0.07) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  .stage{
    width:100%;
    max-width: 560px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 28px;
  }

  .eyebrow-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 12px;
    position:relative;
    width:100%;
  }

  .eyebrow{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .eyebrow svg{ width:16px; height:16px; }

  .sound-toggle{
    appearance:none;
    border: 1px solid var(--line);
    background: #FBFAF6;
    color: var(--ink-soft);
    border-radius: 50%;
    width: 30px;
    height: 30px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition: color 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }
  .sound-toggle:hover{ color: var(--ink); border-color: var(--ink-soft); transform: translateY(-1px); }
  .sound-toggle svg{ width:15px; height:15px; }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(28px, 5vw, 38px);
    margin:0;
    text-align:center;
    letter-spacing: -0.01em;
  }
  h1 em{
    font-style: italic;
    font-weight: 500;
    color: var(--psych);
  }

  .sub{
    margin: -14px 0 0 0;
    font-size: 14px;
    color: var(--ink-soft);
    text-align:center;
  }

  /* the card */
  .card-wrap{
    position:relative;
    width: 100%;
  }

  .pin{
    position:absolute;
    top:-14px;
    left:50%;
    transform: translateX(-50%) rotate(-4deg);
    width:26px;
    height:26px;
    z-index:3;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.15));
  }

  .card{
    position:relative;
    background: #FBFAF6;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 52px 36px 40px;
    min-height: 260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 18px;
    text-align:center;
    box-shadow: 0 1px 0 rgba(38,50,41,0.03);
    overflow:hidden;
    transition: transform 0.15s ease;
  }

  .stamp{
    position:absolute;
    top:16px;
    left:16px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 5px 10px 4px;
    border-radius: 20px;
    border: 1.3px solid currentColor;
    transform: rotate(-3deg);
    transition: color 0.2s ease, background 0.2s ease, opacity 0.2s ease;
  }

  .count{
    position:absolute;
    top:18px;
    right:18px;
    font-size:11px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }

  .word-en{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(26px, 6vw, 36px);
    line-height:1.15;
    min-height: 1.3em;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .word-zh{
    font-family: 'Noto Serif SC', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--ink-soft);
    min-height: 1.3em;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .rolling .word-en, .rolling .word-zh{
    filter: blur(1.5px);
    opacity: 0.7;
  }

  .settle{
    animation: pop 0.42s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{
    0%{ transform: scale(0.94); }
    55%{ transform: scale(1.035); }
    100%{ transform: scale(1); }
  }

  .hairline{
    width: 46px;
    height: 1px;
    background: var(--line);
  }

  /* button */
  .draw-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background: var(--ink);
    color: var(--paper);
    font-family:'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.02em;
    padding: 14px 28px;
    border-radius: 999px;
    display:flex;
    align-items:center;
    gap: 10px;
    transition: transform 0.15s ease, background 0.2s ease;
  }
  .draw-btn:hover{ transform: translateY(-1px); }
  .draw-btn:active{ transform: translateY(0px) scale(0.98); }
  .draw-btn:disabled{ opacity: 0.55; cursor: default; transform:none; }

  .draw-btn svg{
    width: 15px; height:15px;
    transition: transform 0.5s ease;
  }
  .draw-btn.spin svg{
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  /* timer card */
  .timer-card{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
    padding: 24px 20px 28px;
    background: #FBFAF6;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
  }

  .timer-phase{
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--socio);
    transition: color 0.3s ease;
  }
  .timer-phase.present{ color: var(--hist); }
  .timer-phase.done{ color: var(--econ); }

  .timer-ring-wrap{
    position:relative;
    width: 168px;
    height: 168px;
  }
  .timer-ring{
    width:100%;
    height:100%;
    transform: rotate(-90deg);
  }
  .ring-track{
    fill:none;
    stroke: var(--line);
    stroke-width: 7;
  }
  .ring-progress{
    fill:none;
    stroke: var(--socio);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-dasharray: 502.65;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
  }
  .ring-progress.present{ stroke: var(--hist); }
  .ring-progress.done{ stroke: var(--econ); }

  .tick{
    stroke: var(--line);
    stroke-width: 2;
  }
  .tick.major{
    stroke: var(--ink-soft);
    stroke-width: 2.4;
    opacity: 0.5;
  }

  .ring-dot{
    fill: var(--socio);
    transition: fill 0.3s ease;
  }
  .ring-dot.present{ fill: var(--hist); }
  .ring-dot.done{ fill: var(--econ); opacity:0; }

  .timer-time{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }

  .timer-controls{
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .timer-btn{
    appearance:none;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 999px;
    padding: 10px 18px;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
  }
  .timer-btn:active{ transform: scale(0.97); }
  .timer-btn svg{ width:13px; height:13px; }

  .timer-btn.primary{
    border:none;
    background: var(--ink);
    color: var(--paper);
  }
  .timer-btn.primary:hover{ transform: translateY(-1px); }

  .timer-btn.ghost{
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
  }
  .timer-btn.ghost:hover{ color: var(--ink); border-color: var(--ink-soft); }

  .pulse{
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.05); }
  }

  /* legend */
  .legend{
    display:flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content:center;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .dot{
    width:7px; height:7px;
    border-radius:50%;
    display:inline-block;
  }

  .credit{
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    opacity: 0.7;
    font-family: 'Space Grotesk', sans-serif;
  }

  @media (prefers-reduced-motion: reduce){
    .settle, .draw-btn.spin svg{ animation: none !important; }
  }

  /* ---------- mode toggle ---------- */
  .mode-toggle{
    display:flex;
    background:#FBFAF6;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .mode-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background: transparent;
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 8px 18px;
    border-radius: 999px;
    display:flex;
    align-items:center;
    gap: 6px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mode-btn .mode-en{ font-size: 11px; opacity:0.75; }
  .mode-btn.active{ background: var(--ink); color: var(--paper); }
  .mode-btn:not(.active):hover{ color: var(--ink); }

  /* ---------- guide buttons ---------- */
  .guide-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    width:100%;
  }
  .guide-btn{
    appearance:none;
    cursor:pointer;
    border: 1px solid var(--line);
    background: #FBFAF6;
    color: var(--ink);
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border-radius: 999px;
    padding: 10px 16px;
    display:flex;
    align-items:center;
    gap: 8px;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .guide-btn svg{ width:14px; height:14px; flex-shrink:0; }
  .guide-btn .guide-en{ color: var(--ink-soft); font-size:11px; }
  .guide-btn:hover{ transform: translateY(-1px); border-color: var(--ink-soft); background:#fff; }

  /* ---------- feedback box ---------- */
  .feedback-card{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 10px;
    padding: 18px 18px 16px;
    background: #FBFAF6;
    border: 1.5px dashed var(--line);
    border-radius: 14px;
  }
  .feedback-label{
    font-size: 11px;
    font-weight:600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .feedback-input{
    width:100%;
    min-height: 70px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-family:'Space Grotesk', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    background: #fff;
  }
  .feedback-input:focus{ outline:none; border-color: var(--ink-soft); }
  .feedback-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .feedback-status{
    font-size: 12px;
    color: var(--ink-soft);
  }
  .feedback-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    background: var(--ink);
    color: var(--paper);
    font-family:'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.2s ease;
  }
  .feedback-btn:hover{ transform: translateY(-1px); }
  .feedback-btn:disabled{ opacity:0.5; cursor:default; transform:none; }

  /* ---------- modals ---------- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(38,50,41,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.show{ display:flex; }

  .modal-box{
    background: #FBFAF6;
    border-radius: 16px;
    border: 1.5px solid var(--line);
    max-width: 480px;
    width:100%;
    max-height: 82vh;
    overflow-y: auto;
    padding: 30px 26px 26px;
    position: relative;
    box-shadow: 0 12px 40px rgba(38,50,41,0.18);
  }

  .modal-x{
    position:absolute;
    top:14px;
    right:14px;
    appearance:none;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .modal-x svg{ width:13px; height:13px; }
  .modal-x:hover{ color: var(--ink); border-color: var(--ink-soft); }

  .guide-box h2{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 21px;
    margin: 0 0 4px;
    padding-right: 30px;
  }
  .guide-box .guide-sub{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 18px;
  }
  .guide-box h3{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--socio);
    margin: 20px 0 8px;
  }
  .guide-box h3:first-of-type{ margin-top: 4px; }
  .guide-box ul{
    margin: 0 0 4px;
    padding-left: 18px;
  }
  .guide-box li{
    margin-bottom: 8px;
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--ink);
  }
  .guide-box li b{ font-weight:600; }
  .guide-box li .zh{
    color: var(--ink-soft);
    font-family: 'Noto Serif SC', serif;
    font-size: 12.5px;
  }
  .guide-box p{
    font-size: 13.5px;
    line-height: 1.6;
    margin: 0 0 10px;
  }
  .guide-box a{ color: var(--hist); }
</style>
</head>
<body>

<div class="stage">

  <div class="eyebrow-row">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      WordGarden · 词汇花园
    </div>
    <button class="sound-toggle" id="soundToggle" aria-label="Toggle sound" title="Toggle sound">
      <svg id="soundOnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg id="soundOffIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z"/><line x1="17" y1="9" x2="22" y2="14"/><line x1="22" y1="9" x2="17" y2="14"/></svg>
    </button>
  </div>

  <div>
    <h1>Pick a word,<br><em>let it grow</em></h1>
  </div>

  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active" data-mode="academic">学术 <span class="mode-en">Academic</span></button>
    <button class="mode-btn" data-mode="daily">日常 <span class="mode-en">Daily</span></button>
  </div>

  <div class="card-wrap">
    <svg class="pin" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="8" r="6" fill="#D96E5C" stroke="#8a3f30" stroke-width="1"/>
      <line x1="12" y1="13" x2="12" y2="21" stroke="#8a3f30" stroke-width="1.4"/>
    </svg>

    <div class="card" id="card">
      <div class="stamp" id="stamp">welcome</div>
      <div class="count" id="count">— / 150</div>
      <div class="word-en" id="wordEn">Tap the button below</div>
      <div class="hairline"></div>
      <div class="word-zh" id="wordZh">点击下方按钮开始</div>
    </div>
  </div>

  <button class="draw-btn" id="drawBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    <span id="btnLabel">Draw a word</span>
  </button>

  <div class="timer-card" id="timerCard" hidden>
    <div class="timer-phase" id="timerPhase">Prep · 准备</div>

    <div class="timer-ring-wrap">
      <svg class="timer-ring" id="timerRing" viewBox="0 0 180 180">
        <circle class="ring-track" cx="90" cy="90" r="80"></circle>
        <g id="ticksGroup"></g>
        <circle class="ring-progress" id="ringProgress" cx="90" cy="90" r="80"></circle>
        <circle class="ring-dot" id="ringDot" cx="90" cy="10" r="4"></circle>
      </svg>
      <div class="timer-time" id="timerTime">15:00</div>
    </div>

    <div class="timer-controls">
      <button class="timer-btn primary" id="timerToggleBtn">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        <span id="timerToggleLabel">Start prep</span>
      </button>
      <button class="timer-btn ghost" id="timerSkipBtn">Present now · 1min</button>
      <button class="timer-btn ghost" id="timerResetBtn">Reset</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="guide-row">
    <button class="guide-btn" data-guide="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      检索指南 <span class="guide-en">Research</span>
    </button>
    <button class="guide-btn" data-guide="speak">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19v3"/><path d="M8 22h8"/><rect x="8" y="2" width="8" height="12" rx="4"/><path d="M18 10a6 6 0 0 1-12 0"/></svg>
      表达指南 <span class="guide-en">Speak</span>
    </button>
    <button class="guide-btn" data-guide="notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="16" y2="11"/></svg>
      笔记指南 <span class="guide-en">Notes</span>
    </button>
  </div>

  <div class="feedback-card">
    <div class="feedback-label">Feedback · 意见反馈</div>
    <textarea id="feedbackInput" class="feedback-input" placeholder="有什么想法、bug 或者建议都可以写在这里…"></textarea>
    <div class="feedback-row">
      <span class="feedback-status" id="feedbackStatus"></span>
      <button class="feedback-btn" id="feedbackBtn">Send · 发送</button>
    </div>
  </div>

  <div class="credit">Built by Sarah艺婕 · 全平台同名</div>

</div>

<!-- Guide modal -->
<div class="modal-overlay" id="guideOverlay">
  <div class="modal-box guide-box">

function ensureAudio(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

// short high wooden "tick" for each rolling step
function playTick(){
  if(muted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.value = 900 + Math.random() * 260;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.05, now + 0.004);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + 0.06);
}

// soft shimmering chime when a word is drawn
function playChime(){
  if(muted || !audioCtx) return;
  const now = audioCtx.currentTime;
  const freqs = [880, 1108.73, 1567.98]; // A5, C#6, G6 shimmer
  freqs.forEach((f, i) => {
    const start = now + i * 0.035;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f, start);
    osc.frequency.exponentialRampToValueAtTime(f * 1.02, start + 0.9);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(0.07, start + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + 1.2);
  });
}

soundToggle.addEventListener('click', () => {
  ensureAudio();
  muted = !muted;
  soundOnIcon.style.display = muted ? 'none' : 'block';
  soundOffIcon.style.display = muted ? 'block' : 'none';
});

function setCategoryStyle(cat){
  const meta = catMeta[cat];
  stamp.textContent = meta.label;
  stamp.style.color = meta.color;
  stamp.style.background = meta.bg;
}

function draw(){
  if(rolling) return;
  ensureAudio();
  rolling = true;
  btn.disabled = true;
  btn.classList.add('spin');
  btnLabel.textContent = 'Rolling…';
  card.classList.remove('settle');
  card.classList.add('rolling');

  const p = pool();
  const final = p[Math.floor(Math.random() * p.length)];

  let tick = 0;
  const totalTicks = 16;
  const baseDelay = 45;

  function step(){
    const r = p[Math.floor(Math.random() * p.length)];
    wordEn.textContent = r.en;
    wordZh.textContent = r.zh;
    setCategoryStyle(r.cat);
    playTick();

    tick++;
    if(tick < totalTicks){
      const progress = tick / totalTicks;
      const delay = baseDelay + progress * progress * 140; // ease out, slows down
      setTimeout(step, delay);
    } else {
      // land on the real result
      wordEn.textContent = final.en;
      wordZh.textContent = final.zh;
      setCategoryStyle(final.cat);
      card.classList.remove('rolling');
      card.classList.add('settle');
      playChime();
      drawn = Math.min(drawn + 1, p.length);
      count.textContent = drawn + ' / ' + p.length;
      timerCard.hidden = false;
      resetTimer();

      rolling = false;
      btn.disabled = false;
      btn.classList.remove('spin');
      btnLabel.textContent = 'Draw another';
    }
  }
  step();
}

btn.addEventListener('click', draw);

    stamp.textContent = 'welcome';

    card.classList.remove('settle', 'rolling');
    btnLabel.textContent = 'Draw a word';

});

function prepSeconds(){ return currentMode === 'daily' ? 5 * 60 : 15 * 60; }
const PRESENT_SECONDS = 60;
const RING_C = 2 * Math.PI * 80; // matches r=80 in the SVG

const timerCard = document.getElementById('timerCard');
const timerPhase = document.getElementById('timerPhase');
const timerTime = document.getElementById('timerTime');
const ringProgress = document.getElementById('ringProgress');
const ringDot = document.getElementById('ringDot');
const ticksGroup = document.getElementById('ticksGroup');
const timerToggleBtn = document.getElementById('timerToggleBtn');
const timerToggleLabel = document.getElementById('timerToggleLabel');
const timerSkipBtn = document.getElementById('timerSkipBtn');
const timerResetBtn = document.getElementById('timerResetBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');

let timerPhaseName = 'prep'; // 'prep' | 'present' | 'done'
let timerStarted = false;
let timerRemaining = prepSeconds();
let timerTotal = prepSeconds();
let timerInterval = null;

ringProgress.style.strokeDasharray = RING_C;

function buildTicks(){
  let html = '';
  for(let i = 0; i < 12; i++){
    const angle = i * 30;
    const major = i % 3 === 0;
    const y1 = major ? 16 : 12;
    html += '<line class="tick' + (major ? ' major' : '') + '" x1="90" y1="' + y1 + '" x2="90" y2="4" transform="rotate(' + angle + ' 90 90)"></line>';
  }
  ticksGroup.innerHTML = html;
}
buildTicks();

function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}

function updateRing(){
  const fraction = Math.max(timerRemaining, 0) / timerTotal;
  ringProgress.style.strokeDashoffset = RING_C * (1 - fraction);
  timerTime.textContent = formatTime(Math.max(timerRemaining, 0));

  const angle = fraction * 360 * (Math.PI / 180);
  ringDot.setAttribute('cx', 90 + 80 * Math.cos(angle));
  ringDot.setAttribute('cy', 90 + 80 * Math.sin(angle));
}

function clearPhaseClasses(){
  timerPhase.classList.remove('present', 'done');
  ringProgress.classList.remove('present', 'done');
  ringDot.classList.remove('present', 'done');
}

function updateControls(){
  // "Present now" only makes sense before anything has been started
  timerSkipBtn.style.display = (!timerStarted && timerPhaseName !== 'done') ? 'flex' : 'none';
  timerResetBtn.style.display = (timerStarted || timerPhaseName === 'done') ? 'flex' : 'none';
}

function startPhase(phaseName){
  timerPhaseName = phaseName;
  timerStarted = true;
  timerTotal = phaseName === 'prep' ? prepSeconds() : PRESENT_SECONDS;
  timerRemaining = timerTotal;

  clearPhaseClasses();
  if(phaseName === 'prep'){
    timerPhase.textContent = 'Prep · 准备';
  } else {
    timerPhase.textContent = 'Present · 展示';
    timerPhase.classList.add('present');
    ringProgress.classList.add('present');
    ringDot.classList.add('present');
  }

  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
  timerToggleLabel.textContent = 'Pause';
  updateRing();
  updateControls();

  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(tickSecond, 1000);
}

function tickSecond(){
  timerRemaining--;
  updateRing();
  if(timerRemaining <= 10 && timerRemaining > 0){
    playTick();
  }
  if(timerRemaining <= 0){
    clearInterval(timerInterval);
    timerInterval = null;
    if(timerPhaseName === 'prep'){
      playChime();
      startPhase('present');
    } else if(timerPhaseName === 'present'){
      playChime();
      finishTimer();
    }
  }
}

function finishTimer(){
  timerPhaseName = 'done';
  clearPhaseClasses();
  timerPhase.textContent = "Time's up · 时间到";
  timerPhase.classList.add('done');
  ringProgress.classList.add('done');
  ringDot.classList.add('done');
  timerTime.textContent = '00:00';
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  timerToggleLabel.textContent = 'New round';
  timerCard.classList.add('pulse');
  setTimeout(() => timerCard.classList.remove('pulse'), 1600);
  updateControls();
}

function pauseTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  timerToggleLabel.textContent = 'Resume';
}

function resumeTimer(){
  playIcon.style.display = 'none';
  pauseIcon.style.display = 'block';
  timerToggleLabel.textContent = 'Pause';
  timerInterval = setInterval(tickSecond, 1000);
}

function resetTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  timerPhaseName = 'prep';
  timerStarted = false;
  timerTotal = prepSeconds();
  timerRemaining = prepSeconds();
  clearPhaseClasses();
  timerCard.classList.remove('pulse');
  timerPhase.textContent = 'Prep · 准备';
  playIcon.style.display = 'block';
  pauseIcon.style.display = 'none';
  timerToggleLabel.textContent = 'Start prep';
  updateRing();
  updateControls();
}

timerToggleBtn.addEventListener('click', () => {
  ensureAudio();
  if(timerPhaseName === 'done'){
    resetTimer();
    return;
  }
  if(timerInterval){
    pauseTimer();
  } else if(!timerStarted){
    startPhase('prep');
  } else {
    resumeTimer();
  }
});

timerSkipBtn.addEventListener('click', () => {
  ensureAudio();
  startPhase('present');
});

timerResetBtn.addEventListener('click', () => {
  ensureAudio();
  resetTimer();
});

updateRing();
updateControls();
